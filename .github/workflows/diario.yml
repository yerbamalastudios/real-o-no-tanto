name: Pronóstico diario

on:
  schedule:
    - cron: "43 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar SMN y Meteored
        env:
          METEORED_KEY: ${{ secrets.METEORED_KEY }}
          ACCUWEATHER_KEY: ${{ secrets.ACCUWEATHER_KEY }}
        run: python recolector.py
      - name: Guardar
        run: |
          git config user.name "pronostico-bot"
          git config user.email "pronostico-bot@users.noreply.github.com"
          git add datos
          git diff --cached --quiet || git commit -m "Datos del día"
          git push
